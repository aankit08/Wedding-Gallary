<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    height: 100%;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

/* Background */
.slider {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -2;
}

.slider img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    animation: slide 20s infinite, zoom 20s infinite;
    filter: brightness(55%);
}

@keyframes zoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
}

.slider img:nth-child(1) { animation-delay: 0s; }
.slider img:nth-child(2) { animation-delay: 5s; }
.slider img:nth-child(3) { animation-delay: 10s; }
.slider img:nth-child(4) { animation-delay: 15s; }

@keyframes slide {
    0% { opacity: 0; }
    10% { opacity: 1; }
    30% { opacity: 1; }
    40% { opacity: 0; }
    100% { opacity: 0; }
}

/* Overlay */
.overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
}

/* Title */
h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 65px;
    color: gold;
    text-shadow: 0 0 20px gold;
}

/* Buttons */
button {
    padding: 12px 25px;
    margin: 10px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(45deg, gold, orange);
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: crimson;
    color: white;
    transform: scale(1.1);
}

/* Mobile */
@media (max-width: 600px) {
    h1 { font-size: 38px; }
}
</style>
</head>

<body>

<!-- 🎵 Background Music -->
<audio id="bgMusic" loop preload="auto">
    <source src="music1.mp3" type="audio/mpeg">
</audio>

<!-- 🌸 Background -->
<div class="slider">
    <img src="bg1.jpeg">
    <img src="bg2.jpeg">
    <img src="bg3.jpeg">
    <img src="bg4.jpeg">
</div>

<!-- 💍 Content -->
<div class="overlay">
    <h1>Chandan & Shilpee</h1>

    <div>
        <button onclick="openAlbum('https://photos.app.goo.gl/nrDtFedE9ScXEed1A')">Haldi</button>
        <button onclick="openAlbum('https://photos.app.goo.gl/JU1aT79mDqr3JxaDA')">Mehndi</button>
        <button onclick="openAlbum('https://photos.app.goo.gl/Q5imL7eBE9i97ShF6')">Wedding</button>
        <button onclick="openAlbum('https://photos.app.goo.gl/NcCiBkXKYgUxzmUUA')">Reception</button>
    </div>
</div>

<script>
function openAlbum(link) {
    window.open(link, "_blank");
}

/* 🔥 Music Autoplay Fix */
const music = document.getElementById("bgMusic");

function startMusic() {
    music.play().catch(() => {});
}

document.addEventListener("click", startMusic, { once: true });
document.addEventListener("touchstart", startMusic, { once: true });
</script>

</body>
</html>
